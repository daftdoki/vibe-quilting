# Builds the app and publishes it to GitHub Pages on every push to main.
#
# Every action is pinned to a commit, and every version here was released at
# least 14 days before it was added, to follow the repo's dependency age rule
# (see CLAUDE.md). Check the release date before raising any of them.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, released 2026-07-20
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-node v7.1.0, released 2026-10-08. Node 24.22.2 was released 2026-10-27.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - run: npm ci
      - run: npm test
      # The site lives at https://<user>.github.io/<repo>/, so assets need that prefix.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # actions/configure-pages v6.0.0, released 2026-03-25
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # actions/upload-pages-artifact v5.0.0, released 2026-04-10
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.1, released 2026-09-01
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
